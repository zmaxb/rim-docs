site_name: РИМ
site_description: Расширение Интеграции Мессенджеров (РИМ)
site_author: zmaxb

copyright: Документация РИМ · Редакция от 25.07.2026

theme:
  name: material
  language: ru
  logo: assets/logo.png
  favicon: assets/favicon.ico
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    scheme: slate
    primary: black
    accent: deep purple

  features:
    #- navigation.expand
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - def_list
  - footnotes
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.keys
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Расширение:
      - 📘 Введение: index.md
      - 📦 Установка: getting-started/installation.md
      - 🚀 Telegram: getting-started/telegram.md
      - 🚀 ВКонтакте:
          - Подготовка сообщества: getting-started/vk-community.md
          - Проверка бота: getting-started/vk.md

  - Боты:
      - 📘 Введение: bots/index.md
      - 🧠 Модель:
          - 🧪 Создание модели: bots/create-model.md
          - 📚 Разработка моделей: bots/model-development.md
      - 🤖 Бот:
          - 🧪 Создание бота: bots/create-bot.md
          - 📚 Разработка ботов: bots/bot-development.md

  - Интеграции:
      - 📘 Введение: integrations/index.md
      - 📐 Архитектура: integrations/architecture.md
      - 🔑 Управление доступом: integrations/access-control.md
      - 🧩 Создание интеграции: integrations/create-integration.md

extra_css:
  - stylesheets/extra.css